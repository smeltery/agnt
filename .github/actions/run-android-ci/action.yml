name: Run Android CI
description: Set up the Android toolchain and run the AgntAndroid debug CI task.

runs:
  using: composite
  steps:
    - name: Setup Flox
      uses: flox/install-flox-action@v2

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Check and assemble debug
      shell: bash
      working-directory: AgntAndroid
      run: flox activate -d "$GITHUB_WORKSPACE" -- ./gradlew ciDebug --no-daemon
