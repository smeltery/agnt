name: Android Check

on:
  push:
    paths:
      - ".github/workflows/android-check.yml"
      - "AgntAndroid/**"
  pull_request:
    paths:
      - ".github/workflows/android-check.yml"
      - "AgntAndroid/**"

jobs:
  android-check:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Caches ~/.gradle/caches and ~/.gradle/wrapper across runs. The Android
      # SDK is provisioned by android-actions/setup-android below, which the
      # Gradle plugin discovers via $ANDROID_HOME.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Sets up $ANDROID_HOME + cmdline-tools and pre-accepts SDK licenses.
      # The platform (android-36) and matching build-tools are auto-installed
      # by AGP via sdkmanager on the first ./gradlew run — pinning them here
      # is brittle because build-tools versions can lag the platform release.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # Style gate: ktlint with our editorconfig overrides. Runs before tests
      # so a style-only PR fails fast rather than burning ~30s on Kotlin
      # compile + unit-test work that won't be merged anyway.
      - name: ktlint
        working-directory: AgntAndroid
        run: ./gradlew :app:ktlintCheck --no-daemon

      - name: Run unit tests
        working-directory: AgntAndroid
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      # `assembleDebug` is the cheapest signal that the Kotlin compile, the
      # resources, and the build script all hang together. A separate signed-
      # build workflow handles release artifacts once release signing is set
      # up; the unsigned debug APK below is for PR-side smoke-testing only.
      - name: Assemble debug
        working-directory: AgntAndroid
        run: ./gradlew :app:assembleDebug --no-daemon

      # Unsigned debug APK so reviewers can install a PR build on a device
      # without recompiling locally. Skipped on push events (the artifact
      # would just shadow the released signed build).
      - name: Upload debug APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: agnt-debug-${{ github.event.pull_request.number }}
          path: AgntAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
