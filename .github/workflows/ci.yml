name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Checks to run
        required: true
        default: all
        type: choice
        options:
          - all
          - bun
          - bridge
          - relay
          - web
          - host
          - android
          - ios
          - links
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-${{ github.event.inputs.scope || 'auto' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
      links: ${{ steps.filter.outputs.links }}
      bun_packages: ${{ steps.filter.outputs.bun_packages }}
      lint_workflows: ${{ steps.filter.outputs.lint_workflows }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed surfaces
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          manual_scope="${{ github.event.inputs.scope || '' }}"

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            changed_files="__scheduled_link_check__"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "$manual_scope" == "all" ]]; then
            changed_files="__all__"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            changed_files="__manual_${manual_scope}__"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            changed_files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")"
          else
            before="${{ github.event.before }}"
            if [[ "$before" =~ ^0+$ ]]; then
              changed_files="$(git diff-tree --no-commit-id --name-only -r "${{ github.sha }}")"
            else
              changed_files="$(git diff --name-only "$before" "${{ github.sha }}")"
            fi
          fi

          {
            echo "Changed files:"
            printf '%s\n' "$changed_files"
          } >> "$GITHUB_STEP_SUMMARY"

          matches() {
            local pattern="$1"
            [[ "$changed_files" == "__all__" ]] || printf '%s\n' "$changed_files" | grep -Eq "$pattern"
          }

          requested() {
            local surface="$1"
            [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || return 1
            [[ "$manual_scope" == "all" || "$manual_scope" == "$surface" ]] && return 0
            [[ "$manual_scope" == "bun" && "$surface" =~ ^(bridge|relay|web|host)$ ]]
          }

          should_run() {
            local surface="$1"
            local pattern="$2"
            requested "$surface" || matches "$pattern"
          }

          set_output() {
            local name="$1"
            local value="$2"
            echo "$name=$value" >> "$GITHUB_OUTPUT"
            echo "$name: $value" >> "$GITHUB_STEP_SUMMARY"
          }

          ci_config='^(\.github/workflows/|\.github/actions/|\.github/actionlint\.ya?ml)'
          link_check_action='^\.github/actions/run-link-check/'
          flox_config='^\.flox/'
          bun_common="$flox_config"
          secure_bridge='^agnt-bridge/src/transport/secure-transport\.js'
          secure_web='^agnt-web/src/crypto/'
          secure_ios='^(AgntMobile/AgntMobile/Core/Networking/CodexSecureTransportModels\.swift|AgntMobile/AgntMobile/Services/CodexService/Transport/CodexService\+SecureTransport\.swift)'
          secure_android='^(AgntAndroid/app/src/main/kotlin/com/dotbrains/agnt/mobile/core/model/SecureTransportModels\.kt|AgntAndroid/app/src/main/kotlin/com/dotbrains/agnt/mobile/core/crypto/)'
          secure_transport="$secure_bridge|$secure_web|$secure_ios|$secure_android"
          android_code='^(AgntAndroid/(app|gradle)/|AgntAndroid/(build\.gradle\.kts|settings\.gradle\.kts|gradle\.properties|gradlew|gradlew\.bat))'

          bun_packages=()

          if matches "$ci_config"; then set_output lint_workflows true; else set_output lint_workflows false; fi

          if should_run bridge "$bun_common|$secure_transport|^agnt-bridge/"; then
            set_output bridge true
            bun_packages+=('{"name":"agnt-bridge","working-directory":"agnt-bridge","frozen-lockfile":"true","audit":"true","ci_command":"bun run verify:entrypoints && bun run test"}')
          else
            set_output bridge false
          fi

          if should_run relay "$bun_common|^relay/"; then
            set_output relay true
            bun_packages+=('{"name":"relay","working-directory":"relay","frozen-lockfile":"true","audit":"true","ci_command":"bun run test"}')
          else
            set_output relay false
          fi

          if should_run web "$bun_common|$secure_transport|^agnt-web/"; then
            set_output web true
            bun_packages+=('{"name":"agnt-web","working-directory":"agnt-web","frozen-lockfile":"true","audit":"true","ci_command":"bun run test && bun run typecheck && bun run build:vite && bun run size"}')
          else
            set_output web false
          fi

          if should_run android "$flox_config|$secure_transport|$android_code"; then set_output android true; else set_output android false; fi

          if should_run host "$bun_common|^agnt-host/"; then
            set_output host true
            # agnt-host does not commit a Bun lockfile yet.
            bun_packages+=('{"name":"agnt-host","working-directory":"agnt-host","frozen-lockfile":"false","audit":"false","ci_command":"bun run lint && bun run build"}')
          else
            set_output host false
          fi

          if should_run ios "^AgntMobile/"; then set_output ios true; else set_output ios false; fi

          if [[ "${{ github.event_name }}" == "schedule" ]] || requested links || matches "$link_check_action|^.*\.md$|^\.lycheeignore$"; then set_output links true; else set_output links false; fi

          bun_packages_json="$(printf '%s\n' "${bun_packages[@]}" | jq -s -c '.')"
          set_output bun_packages "$bun_packages_json"

      - name: Lint GitHub Actions workflows
        if: steps.filter.outputs.lint_workflows == 'true'
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            rhysd/actionlint:latest \
            -color

  bun-packages:
    needs: changes
    if: needs.changes.outputs.bun_packages != '[]'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.changes.outputs.bun_packages) }}
    env:
      AGNT_FLOX_QUIET: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Flox
        uses: flox/install-flox-action@v2

      - name: Install package dependencies
        working-directory: ${{ matrix.working-directory }}
        run: |
          set -euo pipefail
          flox activate -d "$GITHUB_WORKSPACE" -- bun --version
          args=()
          if [[ "${{ matrix.frozen-lockfile }}" == "true" ]]; then
            args+=(--frozen-lockfile)
          fi
          timeout 240s flox activate -d "$GITHUB_WORKSPACE" -- bun install "${args[@]}"

      - name: Audit package dependencies
        if: matrix.audit == 'true'
        continue-on-error: true
        working-directory: ${{ matrix.working-directory }}
        run: timeout 120s flox activate -d "$GITHUB_WORKSPACE" -- bun audit

      - name: Run package CI
        working-directory: ${{ matrix.working-directory }}
        run: |
          echo "Running: ${{ matrix.ci_command }}"
          flox activate -d "$GITHUB_WORKSPACE" -- bun run ci

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      AGNT_FLOX_QUIET: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Flox
        uses: flox/install-flox-action@v2

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Check and assemble debug
        working-directory: AgntAndroid
        run: |
          flox activate -d "$GITHUB_WORKSPACE" -- ./gradlew \
            :app:ktlintCheck \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            --no-daemon

      - name: Upload debug APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: agnt-debug-${{ github.event.pull_request.number }}
          path: AgntAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    name: Build unsigned release IPA
    runs-on: blacksmith-6vcpu-macos-26
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned IPA
        run: |
          set -euo pipefail

          output_dir="$GITHUB_WORKSPACE/build/unsigned-ipa"
          archive_path="$output_dir/AgntMobile.xcarchive"
          ipa_path="$output_dir/agnt-unsigned-release.ipa"
          build_log_path="$output_dir/xcodebuild.log"

          rm -rf "$output_dir"
          mkdir -p "$output_dir"

          xcodebuild \
            -project "$GITHUB_WORKSPACE/AgntMobile/AgntMobile.xcodeproj" \
            -scheme AgntMobile \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$archive_path" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee "$build_log_path"

          app_path="$(find "$archive_path/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "Unable to locate an .app bundle in $archive_path" >&2
            exit 1
          fi

          payload_root="$(mktemp -d "$output_dir/payload.XXXXXX")"
          trap 'rm -rf "$payload_root"' EXIT

          mkdir -p "$payload_root/Payload"
          ditto "$app_path" "$payload_root/Payload/$(basename "$app_path")"
          ditto -c -k --sequesterRsrc --keepParent "$payload_root/Payload" "$ipa_path"

          echo "Unsigned IPA created at $ipa_path"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: agnt-unsigned-ipa
          path: build/unsigned-ipa/agnt-unsigned-release.ipa
          if-no-files-found: error
          retention-days: 14

  links:
    needs: changes
    if: needs.changes.outputs.links == 'true'
    name: Link check
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run link check
        uses: ./.github/actions/run-link-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          post-pr-comment: ${{ github.event_name == 'pull_request' }}
          pr-number: ${{ github.event.pull_request.number }}

  ci-summary:
    needs:
      - changes
      - bun-packages
      - android
      - ios
      - links
    if: always()
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Check required jobs
        run: |
          set -euo pipefail

          for result in \
            "${{ needs.changes.result }}" \
            "${{ needs.bun-packages.result }}" \
            "${{ needs.android.result }}" \
            "${{ needs.ios.result }}" \
            "${{ needs.links.result }}"
          do
            case "$result" in
              success|skipped) ;;
              *) echo "CI job failed with result: $result" >&2; exit 1 ;;
            esac
          done
