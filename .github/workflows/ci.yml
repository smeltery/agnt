name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      bridge: ${{ steps.filter.outputs.bridge }}
      relay: ${{ steps.filter.outputs.relay }}
      web: ${{ steps.filter.outputs.web }}
      android: ${{ steps.filter.outputs.android }}
      host: ${{ steps.filter.outputs.host }}
      bun_packages: ${{ steps.filter.outputs.bun_packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed surfaces
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            changed_files="__all__"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            changed_files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")"
          else
            before="${{ github.event.before }}"
            if [[ "$before" =~ ^0+$ ]]; then
              changed_files="$(git diff-tree --no-commit-id --name-only -r "${{ github.sha }}")"
            else
              changed_files="$(git diff --name-only "$before" "${{ github.sha }}")"
            fi
          fi

          {
            echo "Changed files:"
            printf '%s\n' "$changed_files"
          } >> "$GITHUB_STEP_SUMMARY"

          matches() {
            local pattern="$1"
            [[ "$changed_files" == "__all__" ]] || printf '%s\n' "$changed_files" | grep -Eq "$pattern"
          }

          set_output() {
            local name="$1"
            local value="$2"
            echo "$name=$value" >> "$GITHUB_OUTPUT"
            echo "$name: $value" >> "$GITHUB_STEP_SUMMARY"
          }

          common='^(\.github/workflows/ci\.yml|\.github/actions/setup-bun-package/|\.flox/)'
          secure='^(agnt-bridge/src/transport/secure-transport\.js|agnt-web/src/crypto/|AgntAndroid/app/src/main/kotlin/com/dotbrains/agnt/mobile/core/model/SecureTransportModels\.kt|AgntAndroid/app/src/main/kotlin/com/dotbrains/agnt/mobile/core/crypto/)'

          bun_packages=()

          if matches "$common|$secure|^agnt-bridge/"; then
            set_output bridge true
            bun_packages+=('{"name":"agnt-bridge","working-directory":"agnt-bridge","frozen-lockfile":"true","audit":"true"}')
          else
            set_output bridge false
          fi

          if matches "$common|^relay/"; then
            set_output relay true
            bun_packages+=('{"name":"relay","working-directory":"relay","frozen-lockfile":"true","audit":"true"}')
          else
            set_output relay false
          fi

          if matches "$common|$secure|^agnt-web/"; then
            set_output web true
            bun_packages+=('{"name":"agnt-web","working-directory":"agnt-web","frozen-lockfile":"true","audit":"true"}')
          else
            set_output web false
          fi

          if matches "$common|$secure|^AgntAndroid/"; then set_output android true; else set_output android false; fi

          if matches "$common|^agnt-host/"; then
            set_output host true
            # agnt-host does not commit a Bun lockfile yet.
            bun_packages+=('{"name":"agnt-host","working-directory":"agnt-host","frozen-lockfile":"false","audit":"false"}')
          else
            set_output host false
          fi

          bun_packages_json="$(printf '%s\n' "${bun_packages[@]}" | jq -s -c '.')"
          set_output bun_packages "$bun_packages_json"

  bun-packages:
    needs: changes
    if: needs.changes.outputs.bun_packages != '[]'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.changes.outputs.bun_packages) }}
    env:
      AGNT_FLOX_QUIET: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun package
        uses: ./.github/actions/setup-bun-package
        with:
          working-directory: ${{ matrix.working-directory }}
          frozen-lockfile: ${{ matrix.frozen-lockfile }}
          audit: ${{ matrix.audit }}

      - name: Run package CI
        working-directory: ${{ matrix.working-directory }}
        run: flox activate -d "$GITHUB_WORKSPACE" -- bun run ci

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      AGNT_FLOX_QUIET: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Flox
        uses: flox/install-flox-action@v2

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Check and assemble debug
        working-directory: AgntAndroid
        run: |
          flox activate -d "$GITHUB_WORKSPACE" -- ./gradlew \
            :app:ktlintCheck \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            --no-daemon

      - name: Upload debug APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: agnt-debug-${{ github.event.pull_request.number }}
          path: AgntAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  ci-summary:
    needs:
      - changes
      - bun-packages
      - android
    if: always()
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Check required jobs
        run: |
          set -euo pipefail

          for result in \
            "${{ needs.changes.result }}" \
            "${{ needs.bun-packages.result }}" \
            "${{ needs.android.result }}"
          do
            case "$result" in
              success|skipped) ;;
              *) echo "CI job failed with result: $result" >&2; exit 1 ;;
            esac
          done
