name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Checks to run
        required: true
        default: all
        type: choice
        options:
          - all
          - bun
          - bridge
          - relay
          - web
          - host
          - android
          - ios
          - links
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-${{ github.event.inputs.scope || 'auto' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
      links: ${{ steps.filter.outputs.links }}
      lint_workflows: ${{ steps.filter.outputs.lint_workflows }}
      bun_packages: ${{ steps.filter.outputs.bun_packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed surfaces
        id: filter
        shell: bash
        env:
          INPUT_SCOPE: ${{ github.event.inputs.scope || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
        run: |
          ./.github/scripts/detect-ci-changes.sh

  workflow-checks:
    needs: changes
    if: needs.changes.outputs.lint_workflows == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lint GitHub Actions workflows
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            rhysd/actionlint:latest \
            -color

      - name: Test CI change detector
        run: ./.github/scripts/test-detect-ci-changes.sh

  bun-packages:
    needs: changes
    if: needs.changes.outputs.bun_packages != '[]'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.changes.outputs.bun_packages) }}
    env:
      AGNT_FLOX_QUIET: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Flox
        uses: ./.github/actions/setup-flox

      - name: Setup and run package CI
        uses: ./.github/actions/setup-bun-package
        with:
          working-directory: ${{ matrix.working-directory }}
          frozen-lockfile: ${{ matrix.frozen-lockfile }}
          audit: ${{ matrix.audit }}

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      AGNT_FLOX_QUIET: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Flox
        uses: ./.github/actions/setup-flox

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Check and assemble debug
        working-directory: AgntAndroid
        run: |
          flox activate -d "$GITHUB_WORKSPACE" -- ./gradlew ciDebug --no-daemon

      - name: Upload debug APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: agnt-debug-${{ github.event.pull_request.number }}
          path: AgntAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    name: Build unsigned release IPA
    runs-on: blacksmith-6vcpu-macos-26
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned IPA
        run: |
          set -euo pipefail

          output_dir="$GITHUB_WORKSPACE/build/unsigned-ipa"
          archive_path="$output_dir/AgntMobile.xcarchive"
          ipa_path="$output_dir/agnt-unsigned-release.ipa"
          build_log_path="$output_dir/xcodebuild.log"

          rm -rf "$output_dir"
          mkdir -p "$output_dir"

          xcodebuild \
            -project "$GITHUB_WORKSPACE/AgntMobile/AgntMobile.xcodeproj" \
            -scheme AgntMobile \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$archive_path" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee "$build_log_path"

          app_path="$(find "$archive_path/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "Unable to locate an .app bundle in $archive_path" >&2
            exit 1
          fi

          payload_root="$(mktemp -d "$output_dir/payload.XXXXXX")"
          trap 'rm -rf "$payload_root"' EXIT

          mkdir -p "$payload_root/Payload"
          ditto "$app_path" "$payload_root/Payload/$(basename "$app_path")"
          ditto -c -k --sequesterRsrc --keepParent "$payload_root/Payload" "$ipa_path"

          echo "Unsigned IPA created at $ipa_path"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: agnt-unsigned-ipa
          path: build/unsigned-ipa/agnt-unsigned-release.ipa
          if-no-files-found: error
          retention-days: 14

  links:
    needs: changes
    if: needs.changes.outputs.links == 'true'
    name: Link check
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run link check
        uses: ./.github/actions/run-link-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          post-pr-comment: ${{ github.event_name == 'pull_request' }}
          pr-number: ${{ github.event.pull_request.number }}

  ci-summary:
    needs:
      - changes
      - workflow-checks
      - bun-packages
      - android
      - ios
      - links
    if: always()
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Check required jobs
        run: |
          set -euo pipefail

          for result in \
            "${{ needs.changes.result }}" \
            "${{ needs.workflow-checks.result }}" \
            "${{ needs.bun-packages.result }}" \
            "${{ needs.android.result }}" \
            "${{ needs.ios.result }}" \
            "${{ needs.links.result }}"
          do
            case "$result" in
              success|skipped) ;;
              *) echo "CI job failed with result: $result" >&2; exit 1 ;;
            esac
          done
