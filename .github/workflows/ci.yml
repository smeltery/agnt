name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Checks to run
        required: true
        default: all
        type: choice
        options:
          - all
          - packages
          - bridge
          - relay
          - web
          - host
          - android
          - ios
          - links
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-${{ github.event.inputs.scope || 'auto' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
      links: ${{ steps.filter.outputs.links }}
      lint_workflows: ${{ steps.filter.outputs.lint_workflows }}
      bun_packages: ${{ steps.filter.outputs.bun_packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed surfaces
        id: filter
        shell: bash
        env:
          INPUT_SCOPE: ${{ github.event.inputs.scope || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
        run: |
          ./.github/scripts/detect-ci-changes.sh

      - name: Lint GitHub Actions workflows
        if: steps.filter.outputs.lint_workflows == 'true'
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            rhysd/actionlint:latest \
            -color

      - name: Test CI change detector
        if: steps.filter.outputs.lint_workflows == 'true'
        run: ./.github/scripts/test-detect-ci-changes.sh

  bun-packages:
    needs: changes
    if: needs.changes.outputs.bun_packages != '[]'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      AGNT_FLOX_QUIET: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run selected Bun package CI
        uses: ./.github/actions/run-bun-package-ci
        with:
          packages: ${{ needs.changes.outputs.bun_packages }}

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      AGNT_FLOX_QUIET: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check and assemble debug
        uses: ./.github/actions/run-android-ci

      - name: Upload debug APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: agnt-debug-${{ github.event.pull_request.number }}
          path: AgntAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    name: Build unsigned release IPA
    runs-on: blacksmith-6vcpu-macos-26
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build unsigned IPA
        uses: ./.github/actions/build-unsigned-ios-ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: agnt-unsigned-ipa
          path: build/unsigned-ipa/agnt-unsigned-release.ipa
          if-no-files-found: error
          retention-days: 14

  links:
    needs: changes
    if: needs.changes.outputs.links == 'true'
    name: Link check
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run link check
        uses: ./.github/actions/run-link-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          post-pr-comment: ${{ github.event_name == 'pull_request' }}
          pr-number: ${{ github.event.pull_request.number }}

  ci-summary:
    needs:
      - changes
      - bun-packages
      - android
      - ios
      - links
    if: always()
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Check required jobs
        run: |
          set -euo pipefail

          for result in \
            "${{ needs.changes.result }}" \
            "${{ needs.bun-packages.result }}" \
            "${{ needs.android.result }}" \
            "${{ needs.ios.result }}" \
            "${{ needs.links.result }}"
          do
            case "$result" in
              success|skipped) ;;
              *) echo "CI job failed with result: $result" >&2; exit 1 ;;
            esac
          done
