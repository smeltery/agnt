name: Link Check

# Catches link rot in markdown across the repo. Runs:
#   - on a manual dispatch (so maintainers can verify before a release)
#   - weekly on Monday (one slow-burn "what needs maintenance?" window
#     that aligns with dependabot's cadence)
#   - on PRs that touch markdown files (so new docs land with verified links)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    paths:
      - "**/*.md"
      - ".lycheeignore"
      - ".github/workflows/link-check.yml"

jobs:
  link-check:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    permissions:
      contents: read
      # gh pr comment writes to the PR conversation.
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # One bash step for everything so we have full control over:
      #   * lychee binary (Docker image — known good, no release-asset
      #     guessing)
      #   * report file (lychee writes; we cat to job log + post as
      #     PR comment)
      #   * PR comment (gh CLI, preinstalled on GHA runners — no
      #     third-party-action footgun)
      #   * step diagnostics (every command's exit code printed)
      #
      # Earlier iterations hit a wall because the action wrappers
      # produced stub output or silently failed. This is verbose but
      # debuggable end-to-end from the job log alone.
      - name: Run lychee + post report
        id: lychee
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set +e  # we want to inspect failures, not abort on them

          echo "::group::lychee docker run"
          docker run --rm \
            -v "$PWD:/workdir" \
            -w /workdir \
            -e GITHUB_TOKEN \
            lycheeverse/lychee:latest \
            --no-progress \
            --max-redirects 5 \
            --timeout 20 \
            --max-retries 2 \
            --exclude-path agnt-bridge/README.md \
            --format markdown \
            --output ./lychee-report.md \
            './**/*.md'
          code=$?
          echo "::endgroup::"
          echo "lychee exit code: $code"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

          echo "::group::report contents"
          if [ -f ./lychee-report.md ]; then
            cat ./lychee-report.md
          else
            echo "(lychee did not write a report file)"
          fi
          echo "::endgroup::"

          # Post a comment on the PR so the failure is observable
          # without needing the run page (which requires auth). Falls
          # back to a synthetic message if the report file is missing.
          if [ "$code" -ne 0 ] && [ "$EVENT_NAME" = "pull_request" ]; then
            echo "::group::posting PR comment"
            if [ -f ./lychee-report.md ] && [ -s ./lychee-report.md ]; then
              gh pr comment "$PR_NUMBER" --body-file ./lychee-report.md
            else
              gh pr comment "$PR_NUMBER" \
                --body "Link check failed with exit code $code, but lychee did not write a report file. Investigate the workflow run."
            fi
            echo "::endgroup::"
          fi

          exit "$code"
