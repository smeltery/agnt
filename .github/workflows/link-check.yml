name: Link Check

# Catches link rot in markdown across the repo. Runs:
#   - on a manual dispatch (so maintainers can verify before a release)
#   - weekly on Monday (one slow-burn "what needs maintenance?" window
#     that aligns with dependabot's cadence)
#   - on PRs that touch markdown files (so new docs land with verified links)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    paths:
      - "**/*.md"
      - ".lycheeignore"
      - ".github/workflows/link-check.yml"

jobs:
  link-check:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    permissions:
      contents: read
      # Needed for the "post failure as PR comment" step below.
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run lychee against repo markdown
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # `--accept` widens lychee's default 2xx to include 403 (bot-
          # block) and 429 (rate-limited). `--exclude-path` skips the
          # `agnt-bridge/README.md` symlink — following it resolves
          # intra-repo refs against `agnt-bridge/` instead of repo root.
          args: |
            --no-progress
            --max-redirects 5
            --timeout 20
            --max-retries 2
            --accept 200..=299,403,429
            --exclude-path agnt-bridge/README.md
            './**/*.md'
          token: ${{ secrets.GITHUB_TOKEN }}
          # `fail: false` keeps the action itself green; we control the
          # final outcome below so we can post the report to the PR
          # before failing. The output file gives us something readable
          # to attach.
          fail: false
          output: ./lychee-report.md

      # Make the failure observable. Without this, the only signal on
      # a failed run is "exit code != 0" inside the action — useless
      # to anyone reviewing the PR from outside the GHA UI. This step
      # mirrors what lychee writes to the job summary, into a PR
      # comment that the reviewer (or an agent like Claude Code on the
      # web) can actually read via the GitHub API.
      - name: Post lychee report as PR comment
        if: github.event_name == 'pull_request' && steps.lychee.outputs.exit_code != '0'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: ./lychee-report.md
          # Always create a new comment rather than editing — keeps a
          # historical record across pushes so we can see whether
          # iterating on the workflow narrowed the failure set.

      - name: Fail job when broken links were found
        if: steps.lychee.outputs.exit_code != '0'
        run: |
          echo "::error::lychee reported broken links — see the comment on the PR or the run summary."
          exit 1
