name: Link Check

# Catches link rot in markdown across the repo. Runs:
#   - on a manual dispatch (so maintainers can verify before a release)
#   - weekly on Monday (one slow-burn "what needs maintenance?" window
#     that aligns with dependabot's cadence)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link-check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run link check
        uses: ./.github/actions/run-link-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
