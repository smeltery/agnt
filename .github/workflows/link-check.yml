name: Link Check

# Catches link rot in markdown across the repo. Runs:
#   - on a manual dispatch (so maintainers can verify before a release)
#   - weekly on Monday (one slow-burn "what needs maintenance?" window
#     that aligns with dependabot's cadence)
#   - on PRs that touch markdown files (so new docs land with verified links)

on:
  workflow_dispatch:
  schedule:
    # 06:00 UTC Monday — early enough to land before maintainers wake up
    # in Americas timezones, after Europe is already awake to action it.
    - cron: "0 6 * * 1"
  pull_request:
    paths:
      - "**/*.md"
      - ".lycheeignore"
      - ".github/workflows/link-check.yml"

jobs:
  link-check:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run lychee against repo markdown
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Walk every .md file in the repo. Exclude paths defined in
          # .lycheeignore (build artifacts, vendored content, etc.).
          # `--accept` widens the set of "ok" responses past lychee's
          # default 2xx to include 403 (cloudflare-style bot blocks on
          # otherwise-valid pages like openai.com/index/codex/) and 429
          # (rate-limited but reachable).
          args: |
            --no-progress
            --max-redirects 5
            --timeout 20
            --max-retries 2
            --accept 200..=299,403,429
            './**/*.md'
          # `token:` passes GITHUB_TOKEN through to lychee so authenticated
          # `https://github.com/...` lookups succeed against this repo +
          # any other private repos referenced. Without it lychee gets
          # 404 on every dotbrains/agnt self-link because GitHub treats
          # unauthenticated reads to access-controlled repos as nonexistent.
          token: ${{ secrets.GITHUB_TOKEN }}
          # `jobSummary: true` (default) writes the report into the
          # workflow run's Summary tab — visible without downloading
          # artifacts. We don't need a separate output file or an issue-
          # filing step for v1; that overhead can land later if scheduled
          # runs actually find rot in practice.
          fail: true
