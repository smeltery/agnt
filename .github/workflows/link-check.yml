name: Link Check

# Catches link rot in markdown across the repo. Runs:
#   - on a manual dispatch (so maintainers can verify before a release)
#   - weekly on Monday (matches dependabot's cadence — one slow-burn
#     "what needs maintenance?" notification window)
#   - on PRs that touch markdown files (so a new doc lands with verified links)
#
# Non-blocking on the schedule (issue-based reporting), blocking on PRs
# only when the diff actually touched markdown (paths-filter below).

on:
  workflow_dispatch:
  schedule:
    # 06:00 UTC Monday — early enough to land before maintainers wake up
    # in Americas timezones, after Europe is already awake to action it.
    - cron: "0 6 * * 1"
  pull_request:
    paths:
      - "**/*.md"
      - ".lycheeignore"
      - ".github/workflows/link-check.yml"

jobs:
  link-check:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    permissions:
      # Needed so the scheduled run can file/update a tracking issue
      # listing dead links instead of just failing silently.
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run lychee against repo markdown
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Walk every .md file in the repo. Exclude paths defined in
          # .lycheeignore (build artifacts, vendored content, etc.).
          args: |
            --no-progress
            --max-redirects 5
            --timeout 20
            --max-retries 2
            --accept 200..=299,403,429
            './**/*.md'
          fail: false
          # Only generate a github-issue body when there ARE failures.
          output: ./lychee/out.md

      - name: Create / update tracking issue when scheduled and links broken
        if: github.event_name == 'schedule' && steps.lychee.outputs.exit_code != '0'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Link rot detected by lychee"
          content-filepath: ./lychee/out.md
          labels: |
            documentation
            link-check

      # PR runs fail loudly on broken links rather than filing an issue.
      # The above `fail: false` keeps the action itself green so this
      # condition controls the final outcome.
      - name: Fail PR if broken links were touched
        if: github.event_name == 'pull_request' && steps.lychee.outputs.exit_code != '0'
        run: |
          echo "::error::Broken links detected. See the 'Run lychee' step output for details."
          exit 1
