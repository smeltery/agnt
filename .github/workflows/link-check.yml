name: Link Check

# Catches link rot in markdown across the repo. Runs:
#   - on a manual dispatch (so maintainers can verify before a release)
#   - weekly on Monday (one slow-burn "what needs maintenance?" window
#     that aligns with dependabot's cadence)
#   - on PRs that touch markdown files (so new docs land with verified links)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    paths:
      - "**/*.md"
      - ".lycheeignore"
      - ".github/workflows/link-check.yml"

jobs:
  link-check:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run lychee + post report
        id: lychee
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set +e

          # Sanity: does the image even run?
          echo "::group::lychee --version"
          docker run --rm lycheeverse/lychee:latest --version
          echo "lychee --version exit: $?"
          echo "::endgroup::"

          # `--user 0:0` (root) lets the container write into the
          # host-mounted workspace without uid/gid mismatch grief.
          # `--verbose` makes lychee print what it's doing so failures
          # are visible in the run log. Capture stdout to a file too so
          # we can post it as a fallback when the markdown report is
          # missing.
          echo "::group::lychee scan"
          docker run --rm \
            --user 0:0 \
            -v "$PWD:/workdir" \
            -w /workdir \
            -e GITHUB_TOKEN \
            lycheeverse/lychee:latest \
            --verbose \
            --no-progress \
            --max-redirects 5 \
            --timeout 20 \
            --max-retries 2 \
            --exclude-path agnt-bridge/README.md \
            --format markdown \
            --output ./lychee-report.md \
            './**/*.md' \
            2>&1 | tee ./lychee-stdout.txt
          code=${PIPESTATUS[0]}
          echo "::endgroup::"
          echo "lychee exit code: $code"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

          echo "::group::report file"
          if [ -f ./lychee-report.md ]; then
            cat ./lychee-report.md
          else
            echo "(lychee did not write ./lychee-report.md)"
          fi
          echo "::endgroup::"

          echo "::group::lychee stdout fallback"
          if [ -f ./lychee-stdout.txt ]; then
            cat ./lychee-stdout.txt
          fi
          echo "::endgroup::"

          # Post whichever output we have to the PR.
          if [ "$code" -ne 0 ] && [ "$EVENT_NAME" = "pull_request" ]; then
            echo "::group::posting PR comment"
            if [ -f ./lychee-report.md ] && [ -s ./lychee-report.md ]; then
              gh pr comment "$PR_NUMBER" --body-file ./lychee-report.md
            elif [ -f ./lychee-stdout.txt ] && [ -s ./lychee-stdout.txt ]; then
              {
                echo "Link check failed (exit $code). Report file wasn't written; here is the captured stdout/stderr:"
                echo
                echo '```'
                head -c 50000 ./lychee-stdout.txt
                echo
                echo '```'
              } > ./pr-comment.md
              gh pr comment "$PR_NUMBER" --body-file ./pr-comment.md
            else
              gh pr comment "$PR_NUMBER" --body "Link check failed (exit $code) with no captured output."
            fi
            echo "::endgroup::"
          fi

          exit "$code"
