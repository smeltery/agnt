name: Link Check

# Catches link rot in markdown across the repo. Runs:
#   - on a manual dispatch (so maintainers can verify before a release)
#   - weekly on Monday (one slow-burn "what needs maintenance?" window
#     that aligns with dependabot's cadence)
#   - on PRs that touch markdown files (so new docs land with verified links)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    paths:
      - "**/*.md"
      - ".lycheeignore"
      - ".github/workflows/link-check.yml"

jobs:
  link-check:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run lychee against repo markdown
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Pass `--format markdown --output ./lychee-report.md`
          # directly through args so the report file gets the actual
          # broken-link details (the action's own `output:` input was
          # writing a stub "see actions output" pointer instead of the
          # detailed report).
          # `--exclude-path` skips the `agnt-bridge/README.md` symlink
          # — following it resolves intra-repo refs against
          # `agnt-bridge/` instead of the repo root, so every link
          # falsely reads as broken.
          args: |
            --no-progress
            --max-redirects 5
            --timeout 20
            --max-retries 2
            --exclude-path agnt-bridge/README.md
            --format markdown
            --output ./lychee-report.md
            './**/*.md'
          token: ${{ secrets.GITHUB_TOKEN }}
          fail: false

      # Make the failure observable via PR comment so I can read the
      # detail through the GitHub API without auth-walled run pages.
      - name: Post lychee report as PR comment
        if: github.event_name == 'pull_request' && steps.lychee.outputs.exit_code != '0'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: ./lychee-report.md

      - name: Fail job when broken links were found
        if: steps.lychee.outputs.exit_code != '0'
        run: |
          echo "::error::lychee reported broken links — see the comment on the PR."
          exit 1
