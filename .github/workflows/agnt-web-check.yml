name: Web Check

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/agnt-web-check.yml"
      - ".flox/**"
      - "agnt-web/**"
      - "agnt-bridge/src/transport/secure-transport.js"
      - "AgntAndroid/app/src/main/kotlin/com/dotbrains/agnt/mobile/core/model/SecureTransportModels.kt"
      - "AgntAndroid/app/src/main/kotlin/com/dotbrains/agnt/mobile/core/crypto/**"
  pull_request:
    paths:
      - ".github/workflows/agnt-web-check.yml"
      - ".flox/**"
      - "agnt-web/**"
      - "agnt-bridge/src/transport/secure-transport.js"
      - "AgntAndroid/app/src/main/kotlin/com/dotbrains/agnt/mobile/core/model/SecureTransportModels.kt"
      - "AgntAndroid/app/src/main/kotlin/com/dotbrains/agnt/mobile/core/crypto/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15

    env:
      AGNT_FLOX_QUIET: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # agnt-web is a Vite + React + Vitest project. The Node 20 + Bun 1.3.11
      # toolchain comes from the committed Flox environment (.flox/), matching
      # local dev. Bun runs the install, the vitest suite, the type check, and
      # the production build inside `flox activate`.
      - name: Install Flox
        uses: flox/install-flox-action@v2

      - name: Install web dependencies
        working-directory: agnt-web
        # --frozen-lockfile mirrors `npm ci`: fail rather than auto-update
        # the lockfile when there's a drift between package.json and bun.lock.
        run: flox activate -d "$GITHUB_WORKSPACE" -- bun install --frozen-lockfile

      # Surface dependency advisories on every PR. Non-fatal — agnt-web is a
      # browser-only build so transitive devDependency vulns rarely matter at
      # runtime, but flagging them keeps Dependabot from being the only signal.
      - name: Audit dependencies
        working-directory: agnt-web
        continue-on-error: true
        run: flox activate -d "$GITHUB_WORKSPACE" -- bun audit

      - name: Type check
        working-directory: agnt-web
        run: flox activate -d "$GITHUB_WORKSPACE" -- bun run lint

      - name: Run web unit tests
        working-directory: agnt-web
        run: flox activate -d "$GITHUB_WORKSPACE" -- bun run test

      - name: Build production bundle
        working-directory: agnt-web
        run: flox activate -d "$GITHUB_WORKSPACE" -- bun run build:vite

      # Bundle size guard. Budgets live in `agnt-web/.size-limit.json`;
      # current main bundle is ~135 KB gzip / 12 KB gzip CSS, so the
      # limits (150 / 18) give ~10% headroom. Lazy chunks (mermaid,
      # katex, etc.) are NOT in the budget — they only download on
      # demand. A PR that pushes the entry past the budget fails CI
      # so a casual dep add can't silently grow the critical path.
      - name: Check bundle size
        working-directory: agnt-web
        run: flox activate -d "$GITHUB_WORKSPACE" -- bun run size
