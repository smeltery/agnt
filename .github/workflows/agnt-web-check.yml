name: Web Check

on:
  push:
    paths:
      - ".github/workflows/agnt-web-check.yml"
      - "agnt-web/**"
  pull_request:
    paths:
      - ".github/workflows/agnt-web-check.yml"
      - "agnt-web/**"

jobs:
  web-check:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # agnt-web is a Vite + React + Vitest project. Bun runs the install, the
      # vitest suite, the type check, and the production build. Node is not
      # required at build time but setup-node is cheap and mirrors the bridge
      # workflow for consistency.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install web dependencies
        working-directory: agnt-web
        # --frozen-lockfile mirrors `npm ci`: fail rather than auto-update
        # the lockfile when there's a drift between package.json and bun.lock.
        run: bun install --frozen-lockfile

      # Surface dependency advisories on every PR. Non-fatal — agnt-web is a
      # browser-only build so transitive devDependency vulns rarely matter at
      # runtime, but flagging them keeps Dependabot from being the only signal.
      - name: Audit dependencies
        working-directory: agnt-web
        continue-on-error: true
        run: bun audit

      - name: Type check
        working-directory: agnt-web
        run: bun run lint

      - name: Run web unit tests
        working-directory: agnt-web
        run: bun run test

      - name: Build production bundle
        working-directory: agnt-web
        run: bun run build
