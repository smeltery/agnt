name: Bridge Check

on:
  push:
    paths:
      - ".github/workflows/bridge-check.yml"
      - ".flox/**"
      - "agnt-bridge/**"
  pull_request:
    paths:
      - ".github/workflows/bridge-check.yml"
      - ".flox/**"
      - "agnt-bridge/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge-check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15

    # Silence the Flox activation banner in logs (see .flox/env/manifest.toml).
    env:
      AGNT_FLOX_QUIET: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Toolchain comes from the committed Flox environment (.flox/), so CI runs
      # the exact Node 20 + Bun 1.3.11 pinned for local dev. Every command below
      # runs inside it via `flox activate -d "$GITHUB_WORKSPACE" -- ...` — the
      # -d flag selects the environment while the command keeps its
      # working-directory. Node is still the runtime (require() + node:test);
      # Bun is the installer with a diff-friendly text lockfile (bun.lock).
      - name: Install Flox
        uses: flox/install-flox-action@v2

      - name: Install bridge dependencies
        working-directory: agnt-bridge
        # --frozen-lockfile mirrors `npm ci`: fail rather than auto-update
        # the lockfile when there's a drift between package.json and bun.lock.
        run: flox activate -d "$GITHUB_WORKSPACE" -- bun install --frozen-lockfile

      # Surface dependency advisories on every PR. Non-fatal — agnt-bridge
      # has runtime deps (qrcode-terminal, ws) and ships as a globally-
      # installed CLI, so audit signal matters more than for the web build;
      # we still keep the step non-blocking so a freshly-disclosed CVE on a
      # transitive dep doesn't gate unrelated PRs. Dependabot handles the
      # remediation side.
      - name: Audit dependencies
        working-directory: agnt-bridge
        continue-on-error: true
        run: flox activate -d "$GITHUB_WORKSPACE" -- bun audit

      - name: Verify bridge entrypoints load
        working-directory: agnt-bridge
        run: |
          flox activate -d "$GITHUB_WORKSPACE" -- node -e "const mod = require('./src'); const names = ['startBridge', 'openLastActiveThread', 'watchThreadRollout']; for (const name of names) { if (typeof mod[name] !== 'function') { throw new Error('Missing export: ' + name); } }"

      # Node's built-in test runner picks up `test/*.test.js`. Runs on the
      # same Blacksmith Ubuntu runner so Linux-only paths (systemd-user
      # service install, ImageMagick fallback, systemd-inhibit wake
      # assertion) stay covered on every PR. macOS-only tests inside the
      # suite self-skip with `{ skip: process.platform !== "darwin" }`.
      - name: Run bridge unit tests
        working-directory: agnt-bridge
        run: flox activate -d "$GITHUB_WORKSPACE" -- bun run test
