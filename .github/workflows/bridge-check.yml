name: Bridge Check

on:
  push:
    paths:
      - ".github/workflows/bridge-check.yml"
      - "agnt-bridge/**"
  pull_request:
    paths:
      - ".github/workflows/bridge-check.yml"
      - "agnt-bridge/**"

jobs:
  bridge-check:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Node is still the runtime — bridge code uses `require()` + Node's
      # built-in test runner, and the published package is consumed via
      # `npm install -g @dotbrains/agnt`. We only swapped the install path
      # to bun, which preserves npm-style behavior with a faster install
      # and a diff-friendly text lockfile (bun.lock).
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install bridge dependencies
        working-directory: agnt-bridge
        # --frozen-lockfile mirrors `npm ci`: fail rather than auto-update
        # the lockfile when there's a drift between package.json and bun.lock.
        run: bun install --frozen-lockfile

      - name: Verify bridge entrypoints load
        working-directory: agnt-bridge
        run: |
          node -e "const mod = require('./src'); const names = ['startBridge', 'openLastActiveThread', 'watchThreadRollout']; for (const name of names) { if (typeof mod[name] !== 'function') { throw new Error('Missing export: ' + name); } }"

      # Node's built-in test runner picks up `test/*.test.js`. Runs on the
      # same Blacksmith Ubuntu runner so Linux-only paths (systemd-user
      # service install, ImageMagick fallback, systemd-inhibit wake
      # assertion) stay covered on every PR. macOS-only tests inside the
      # suite self-skip with `{ skip: process.platform !== "darwin" }`.
      - name: Run bridge unit tests
        working-directory: agnt-bridge
        run: bun run test
