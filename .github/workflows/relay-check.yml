name: Relay Check

on:
  push:
    paths:
      - ".github/workflows/relay-check.yml"
      - ".flox/**"
      - "relay/**"
  pull_request:
    paths:
      - ".github/workflows/relay-check.yml"
      - ".flox/**"
      - "relay/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relay-check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15

    env:
      AGNT_FLOX_QUIET: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Node 20 + Bun 1.3.11 come from the committed Flox environment (.flox/),
      # matching local dev. Node is the runtime (require() + node:test); Bun is
      # just the installer. Commands run inside the env via `flox activate`.
      - name: Install Flox
        uses: flox/install-flox-action@v2

      - name: Install relay dependencies
        working-directory: relay
        # --frozen-lockfile mirrors `npm ci`: fail rather than auto-update
        # the lockfile when there's a drift between package.json and bun.lock.
        run: flox activate -d "$GITHUB_WORKSPACE" -- bun install --frozen-lockfile

      # Same audit policy as agnt-bridge: surface advisories on every PR
      # without gating merges on a freshly-disclosed transitive CVE. The
      # relay deploys to a public address (see docs/operations/self-hosting.md),
      # so audit signal is at least as important as for the bridge.
      - name: Audit dependencies
        working-directory: relay
        continue-on-error: true
        run: flox activate -d "$GITHUB_WORKSPACE" -- bun audit

      # Node's built-in runner picks up `relay/*.test.js`. 30 unit tests at
      # the time of writing; covers the secure-transport handshake, the
      # pairing-code TTL, and the WebSocket upgrade path.
      - name: Run relay unit tests
        working-directory: relay
        run: flox activate -d "$GITHUB_WORKSPACE" -- bun run test
