<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>agnt social preview</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
      }
      .brand {
        position: absolute;
        top: 47px;
        left: 60px;
        display: flex;
        align-items: center;
        font-size: 33px;
        font-weight: 650;
        letter-spacing: -2px;
      }
      .brand img {
        width: 42px;
        height: 42px;
        margin-right: 10px;
        border-radius: 12px;
      }
      .edition {
        position: absolute;
        right: 62px;
        top: 62px;
        font-size: 13px;
        color: var(--muted);
      }
      h1 {
        position: absolute;
        left: 60px;
        top: 182px;
        font-size: 67px;
        line-height: 1.06;
        letter-spacing: -3.7px;
        font-weight: 550;
      }
      h1 em {
        font-size: 67px;
        letter-spacing: -3.8px;
      }
      .description {
        position: absolute;
        left: 64px;
        top: 423px;
        font-size: 19px;
        line-height: 1.55;
        color: var(--muted);
      }
      .pill {
        position: absolute;
        left: 63px;
        bottom: 51px;
        padding: 12px 18px;
        border-radius: 99px;
        background: #292c26;
        color: white;
        font-size: 12px;
      }
      .desktop {
        position: absolute; top: 152px; left: 525px; width: 635px;
        border: 1px solid #d9dcd5; border-radius: 12px; overflow: hidden;
        box-shadow: 0 20px 40px -20px #373d3340;
      }
      .phone {
        position: absolute; top: 198px; right: 25px; width: 177px;
        border: 5px solid #34382f; border-radius: 19px; overflow: hidden;
        box-shadow: 0 14px 32px -12px #373d3340;
      }
      .desktop img, .phone img { display: block; width: 100%; height: auto; }
      .note { position: absolute; top: 603px; right: 38px; font-size: 11px; color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="brand"><img src="../assets/app-icon.png" alt="" />agnt.</div>
    <div class="edition">A little tool by smeltery.</div>
    <h1>
      Your agents.<br /><em>A little more<br />freedom.</em>
    </h1>
    <p class="description">
      Coding agents on your machine.<br />The conversation in your pocket.
    </p>
    <div class="pill">Local-first &nbsp;·&nbsp; End-to-end encrypted</div>
    <div class="desktop"><img src="../assets/screenshots/browser-desktop.png" alt="Actual agnt desktop browser interface" /></div>
    <div class="phone"><img src="../assets/screenshots/browser-mobile.png" alt="Actual agnt mobile browser interface" /></div>
    <div class="note">Browser UI · Example conversation data</div>
  </body>
</html>
