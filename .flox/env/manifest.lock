{
  "lockfile-version": 1,
  "manifest": {
    "schema-version": "1.12.0",
    "install": {
      "bun": {
        "pkg-path": "bun",
        "version": "1.3.11"
      },
      "cargo": {
        "pkg-path": "cargo"
      },
      "git": {
        "pkg-path": "git"
      },
      "jdk": {
        "pkg-path": "jdk17"
      },
      "nodejs": {
        "pkg-path": "nodejs_22"
      },
      "rustc": {
        "pkg-path": "rustc"
      }
    },
    "vars": {
      "AGNT_FLOX": "1"
    },
    "hook": {
      "on-activate": "  # Point Gradle/Kotlin at the Flox-provided JDK. All Flox packages merge into\n  # $FLOX_ENV, so its root doubles as JAVA_HOME (it has bin/java + lib/).\n  export JAVA_HOME=\"$FLOX_ENV\"\n\n  # Keep Bun's global cache inside the env cache dir so it survives across\n  # activations without polluting $HOME.\n  export BUN_INSTALL_CACHE_DIR=\"$FLOX_ENV_CACHE/bun\"\n"
    },
    "profile": {
      "common": "  if [ -t 1 ] && [ -z \"${AGNT_FLOX_QUIET:-}\" ]; then\n    echo \"agnt dev env ready — node $(node --version), bun $(bun --version)\"\n    echo \"  Install deps:   (cd agnt-bridge && bun install)   # repeat per JS component\"\n    echo \"  Run the stack:  flox activate --start-services    # relay + bridge\"\n  fi\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "x86_64-darwin",
        "aarch64-linux",
        "x86_64-linux"
      ]
    },
    "services": {
      "bridge": {
        "command": "  cd \"$FLOX_ENV_PROJECT/agnt-bridge\"\n  [ -d node_modules ] || bun install --frozen-lockfile\n  exec node ./bin/agnt.js up\n"
      },
      "relay": {
        "command": "  cd \"$FLOX_ENV_PROJECT/relay\"\n  [ -d node_modules ] || bun install --frozen-lockfile\n  exec node ./server.js\n"
      }
    }
  },
