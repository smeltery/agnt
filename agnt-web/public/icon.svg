<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Maskable-safe: the meaningful glyph stays inside the inner 80% safe zone
       so platforms that crop edges (Android Adaptive Icons) don't clip it. -->
  <rect width="512" height="512" rx="96" fill="#0b0c0f"/>
  <g transform="translate(128 128)" fill="none" stroke="#7aa2f7" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
    <!-- Stylized "a" glyph — same shape used in the favicon when one ships. -->
    <path d="M16 240 L128 16 L240 240" />
    <line x1="56" y1="160" x2="200" y2="160" />
  </g>
</svg>
